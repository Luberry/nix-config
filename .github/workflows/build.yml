# Builds each NixOS host so Renovate PRs (flake.lock, image bumps) show
# breakage before they're merged and deployed.
name: build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [valimar]
    steps:
      # Runners only have ~14GB free; a full system closure needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs --no-link .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
